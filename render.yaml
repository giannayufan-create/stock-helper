# Render Blueprint — 股市小幫手
# Dashboard: https://dashboard.render.com → Blueprint / stock-helper-api
# Free tier sleeps when idle（第一次開啟可能要等 30–60 秒）
#
# 原本變數維持不動；永豐行情只用新名稱 SHIOAJI_*（勿再貼 MARKET_PROVIDER）。

services:
  - type: web
    name: stock-helper-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: nova-pro-app-main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      # ── 原本就有的（不要改名、不要重複貼）──
      - key: HOST
        value: "0.0.0.0"
      - key: MARKET_PROVIDER
        value: fugle
      - key: TRADE_PROVIDER
        value: mock
      - key: FUGLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANALYZER_URL
        value: ""
      # ── 永豐行情（新名稱，可另外新增）──
      - key: SHIOAJI_ENABLED
        value: shioaji
      - key: SHIOAJI_PRODUCTION
        value: "true"
      - key: SHIOAJI_BRIDGE_PORT
        value: "18080"
      - key: SHIOAJI_API_KEY
        sync: false
      - key: SHIOAJI_SECRET_KEY
        sync: false
