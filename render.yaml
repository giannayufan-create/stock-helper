# Render Blueprint — 股市小幫手
# Dashboard: https://dashboard.render.com → stock-helper-api
# Starter stays up (no 15-min spin-down). Free sleeps and first open waits 30–60s.
#
# 原本變數維持不動；永豐行情只用新名稱 SHIOAJI_*（勿再貼 MARKET_PROVIDER）。
#
# 唯一正式後端（2026-10-01 起）。Dashboard 另外設定、未寫進本檔：
#   Disk：mount /app/server/data，1 GB（研究資料 JSONL 重新部署後保留）
#   RESEARCH_REPOSITORY_MODE=dual、FIREBASE_PROJECT_ID / FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY
# 舊服務 stock-helper（-eskj）已暫停，nova-pro-app-main/render.yaml 不再使用。

services:
  - type: web
    name: stock-helper-api
    runtime: docker
    plan: starter
    region: singapore
    rootDir: nova-pro-app-main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      # ── 原本就有的（不要改名、不要重複貼）──
      - key: HOST
        value: "0.0.0.0"
      - key: MARKET_PROVIDER
        value: fugle
      - key: RADAR_MODE
        value: rescue
      - key: TRADE_PROVIDER
        value: mock
      - key: FUGLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANALYZER_URL
        value: ""
      # ── 永豐行情（新名稱，可另外新增）──
      - key: SHIOAJI_ENABLED
        value: shioaji
      - key: SHIOAJI_PRODUCTION
        value: "true"
      - key: SHIOAJI_BRIDGE_PORT
        value: "18080"
      - key: SHIOAJI_API_KEY
        sync: false
      - key: SHIOAJI_SECRET_KEY
        sync: false
