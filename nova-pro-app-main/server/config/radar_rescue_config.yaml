# RADAR FULLSTACK RESCUE v3 — parallel support layer.
# NEVER mutates production A / B / C / BP scores or thresholds.

enabled: true
version: rescue_v3
evaluate_interval_sec: 5
mode: rescue   # rescue | legacy (env RADAR_MODE overrides)

# Multi-lane Active Watch quotas (comparison only unless apply_lane_to_active_watch)
apply_lane_to_active_watch: false
lane_quotas:
  LIQUIDITY_LANE: 20
  ACCELERATION_LANE: 25
  REVERSAL_LANE: 15
  BREAKOUT_LANE: 15
  A_PRIOR_LANE: 10
  B_OPEN_LANE: 10
  SECTOR_LEADER_LANE: 10
  NEWS_EVENT_LANE: 10

# Early Trigger — evidence count (NOT absolute C/BP/heat thresholds)
early_min_evidence: 2
early_block_stale: true
early_block_low_confidence: true

# Opportunity vs Chase (separate — chase never subtracts from opportunity)
opportunity_weights:
  momentum: 0.18
  volume_acceleration: 0.18
  relative_strength: 0.12
  vwap: 0.12
  breakout: 0.1
  trade_aggression: 0.1
  rank_velocity: 0.1
  bp_trend: 0.05
  sector_support: 0.05

chase_thresholds:
  low_max_pct: 2.0
  medium_max_pct: 4.5
  high_max_pct: 7.0
  extreme_gap_pct: 5.0
  extreme_vwap_ext_pct: 2.5

# News context adjustment capped
news_adjustment_max: 5

# Focus
early_focus_top_n: 3
confirmed_focus_top_n: 3
focus_block_low_confidence: true

# Data integrity
coverage_not_ready_below: 40
stale_seconds: 45

# Persistence — stage transitions only (never every tick)
persist_transitions: true
eod_truth_enabled: true

# Trigger score weights
trigger_weights:
  rank_velocity: 0.18
  volume_acceleration: 0.18
  momentum_acceleration: 0.15
  short_return_acceleration: 0.12
  turnover_acceleration: 0.1
  relative_strength_change: 0.08
  vwap_transition: 0.08
  breakout_transition: 0.06
  bp_slope: 0.05
