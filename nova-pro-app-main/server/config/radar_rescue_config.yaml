# RADAR FULLSTACK RESCUE v3 — parallel support layer.
# NEVER mutates production A / B / C / BP scores or thresholds.

enabled: true
version: rescue_v3
evaluate_interval_sec: 5
mode: rescue   # rescue | legacy (env RADAR_MODE overrides)

# Multi-lane Active Watch quotas (comparison only unless apply_lane_to_active_watch)
apply_lane_to_active_watch: false
lane_quotas:
  LIQUIDITY_LANE: 25
  ACCELERATION_LANE: 40
  REVERSAL_LANE: 15
  BREAKOUT_LANE: 20
  A_PRIOR_LANE: 12
  B_OPEN_LANE: 12
  SECTOR_LEADER_LANE: 12
  NEWS_EVENT_LANE: 12

# Early Trigger — evidence count (NOT absolute C/BP/heat thresholds)
early_min_evidence: 1
early_block_stale: true
early_block_low_confidence: false

# Opportunity vs Chase (separate — chase never subtracts from opportunity)
opportunity_weights:
  momentum: 0.18
  volume_acceleration: 0.18
  relative_strength: 0.12
  vwap: 0.12
  breakout: 0.1
  trade_aggression: 0.1
  rank_velocity: 0.1
  bp_trend: 0.05
  sector_support: 0.05

chase_thresholds:
  low_max_pct: 2.0
  medium_max_pct: 4.5
  high_max_pct: 7.0
  extreme_gap_pct: 5.0
  extreme_vwap_ext_pct: 2.5

# News context adjustment capped
news_adjustment_max: 5

# Focus — wider so morning runners reach UI / Today
early_focus_top_n: 8
confirmed_focus_top_n: 12
focus_block_low_confidence: false

# Data integrity
coverage_not_ready_below: 30
stale_seconds: 60

# Persistence — stage transitions only (never every tick)
persist_transitions: true
eod_truth_enabled: true

# Trigger score weights
trigger_weights:
  rank_velocity: 0.18
  volume_acceleration: 0.18
  momentum_acceleration: 0.15
  short_return_acceleration: 0.12
  turnover_acceleration: 0.1
  relative_strength_change: 0.08
  vwap_transition: 0.08
  breakout_transition: 0.06
  bp_slope: 0.05

# Rescue-only promotion (does not change C ranked pool)
rescue_disc_active_min_change_pct: 1.5
rescue_disc_active_min_trigger: 40
rescue_disc_active_min_discovery: 45
ui_promote_watch_top_n: 80

# Bypass C top-30: discovery day-change movers → Rescue ACTIVE/Focus/UI
# 0 = no cap (all above min_change). Comprehensive UI coverage for scanned movers.
board_mover_top_n: 0
board_mover_min_change_pct: 1.5
# Guaranteed UI for any discovery name that already printed +3% (truth-aligned).
board_mover_ui_guarantee_pct: 3.0
